# Render Blueprint: Dashboard > New > Blueprint > pick this repo.
# Free plan, Singapore (closest to Southeast Asian players). No paid resources are declared.
services:
  - type: web
    name: coop-platformer
    runtime: node
    plan: free
    region: singapore
    rootDir: prototype
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MAX_ROOMS      # keep the free instance's tiny CPU from being overloaded
        value: "10"
      - key: MAX_PLAYERS
        value: "10"
      - key: FREE_PLAYERS   # free rooms hold this many; the host unlocks up to MAX_PLAYERS with a Party Pack key
        value: "5"
      - key: BUY_URL        # store page where a Party Pack key is sold (set in the dashboard)
        sync: false
      - key: LS_PRODUCT_ID  # Lemon Squeezy product id; only keys for this product unlock rooms
        sync: false
